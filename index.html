<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Spark</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Spark" />
    <link rel="apple-touch-icon" href="/vite.svg" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,900;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="print.css">
    <link rel="stylesheet" href="typography.css">
    <link rel="stylesheet" href="cards.css">
    <style>
      :root {
        /* Artistic & Sophisticated Theme Variables */
        --bg-deep: #020617; /* Slate 950 */
        --accent-gold: #D4AF37;
        --accent-gold-soft: rgba(212, 175, 55, 0.15);
        
        /* Refined Glassmorphism */
        --glass-bg: rgba(15, 23, 42, 0.6);
        --glass-border: rgba(255, 255, 255, 0.08);
        --glass-blur: 24px;
        
        --f-sans: 'Inter', 'Cairo', sans-serif;
        --f-serif: 'Noto Naskh Arabic', serif;
        --f-display: 'Playfair Display', serif;
      }

      /* Base Styles */
      body {
        background-color: var(--bg-deep);
        background-image: 
          radial-gradient(circle at 0% 0%, rgba(212, 175, 55, 0.03) 0%, transparent 50%),
          radial-gradient(circle at 100% 100%, rgba(56, 189, 248, 0.03) 0%, transparent 50%),
          url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=3540&auto=format&fit=crop');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        color: #f8fafc;
        min-height: 100vh;
        font-family: var(--f-sans);
        overflow-x: hidden;
        -webkit-tap-highlight-color: transparent;
      }

      /* Enhanced Glass Card */
      .glass-card {
        background: var(--glass-bg);
        backdrop-filter: blur(var(--glass-blur));
        -webkit-backdrop-filter: blur(var(--glass-blur));
        border: 1px solid var(--glass-border);
        box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.5);
        transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      }
      
      .glass-card:hover {
        border-color: rgba(255, 255, 255, 0.15);
        transform: translateY(-2px);
      }

      /* Typography Overrides */
      .font-spiritual { font-family: var(--f-serif); }
      .font-display { font-family: var(--f-display); }
      .font-ui { font-family: var(--f-sans); }

      /* Custom Scrollbar */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

      /* Animation Helpers */
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      .animate-float { animation: float 6s ease-in-out infinite; }

      /* RTL specific tweaks */
      [dir="rtl"] .tracking-wider { letter-spacing: 0; }
      [dir="rtl"] .tracking-tighter { letter-spacing: 0; }
    </style>
    <script>
      // Force dark mode logic for Tailwind
      document.documentElement.classList.add('dark');
    </script>
